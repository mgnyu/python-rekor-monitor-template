[project]
name = "python-rekor-monitor"
version = "0.1.0"
description = ""
authors = [{ name = "mgnyu" , email = "mg8207@nyu.edu"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests (>=2.32,<3.0)",
    "cryptography (>=43.0,<47.0)",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "^0.16"
mypy = "^2.3"
bandit = "^1.9"
types-requests = "^2.32"

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["main.py", "merkle_proof.py", "util.py"]

[tool.bandit]
exclude_dirs = [".venv", "tests"]
